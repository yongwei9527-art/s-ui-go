name: Release s-ui-go three-platform amd64 packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New s-ui-go tag (must not already exist)
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

# The workflow is manually dispatched and the only write is creating the requested tag/release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package-and-release:
    name: Build, verify, and publish three-platform packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact dispatch commit
        # actions/checkout v7.0.1, pinned to its immutable commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify immutable release target and requested tag
        env:
          TAG: ${{ inputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^s-ui-go-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tag must be exactly s-ui-go-vX.Y.Z.' >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -z "$(git status --porcelain)"
          existing_ref="$(git ls-remote --tags --refs origin "refs/tags/$TAG")"
          test -z "$existing_ref" || {
            echo "Tag $TAG already exists; choose a new tag." >&2
            exit 1
          }
          printf 'RELEASE_SHA=%s\n' "$DISPATCH_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js
        # actions/setup-node v7.0.0, pinned to its immutable commit SHA.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A clean checkout must generate frontend/dist before Go compiles embedded assets.
      - name: Install, test, lint, and build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:unit
          npm run build
          test -f dist/index.html

      - name: Set up Go
        # actions/setup-go v7.0.0, pinned to its immutable commit SHA.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum

      - name: Verify installers and backend
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh install-linux.sh uninstall-linux.sh s-ui.sh install-macos.sh uninstall-macos.sh
          go mod verify
          go_packages="$(go list ./... | grep -v '/frontend/node_modules/')"
          go test $go_packages -count=1 -timeout=15m
          go vet $go_packages
          production_tags='with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_tailscale,with_naive_outbound,with_purego'
          go test -tags "$production_tags" $go_packages -run '^$' -count=1 -timeout=15m
          go test -tags "$production_tags" ./internal/xrayruntime \
            -run '^TestSingBoxAndEmbeddedXrayOperateTogether$' -count=1 -timeout=3m

      - name: Build and validate Windows amd64 package
        env:
          GOFLAGS: -mod=readonly
        shell: pwsh
        run: ./build-windows.ps1 -System windows -Architecture amd64 -NoCGO -SkipFrontend -Package -NonInteractive

      - name: Build and validate Linux amd64 package
        env:
          GOFLAGS: -mod=readonly
        shell: pwsh
        run: ./build-windows.ps1 -System linux -Architecture amd64 -NoCGO -SkipFrontend -Package -NonInteractive

      - name: Build and validate macOS amd64 package
        env:
          GOFLAGS: -mod=readonly
        shell: pwsh
        run: ./build-windows.ps1 -System darwin -Architecture amd64 -NoCGO -SkipFrontend -Package -NonInteractive

      - name: Independently verify the three archives and SHA-256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          for system in windows linux macos; do
            archive="dist/s-ui-${system}-amd64.zip"
            sidecar="${archive}.sha256"
            test -s "$archive"
            test -s "$sidecar"
            unzip -t "$archive"
            (
              cd dist
              sha256sum --strict --check "s-ui-${system}-amd64.zip.sha256"
            )
          done
          ARCHIVES='dist/s-ui-windows-amd64.zip dist/s-ui-linux-amd64.zip dist/s-ui-macos-amd64.zip' python3 - <<'PY'
          import hashlib
          import os
          import sys
          import zipfile

          docs = ("README.md", "RELEASE_NOTES.md", "PROTOCOL_GUIDE.md", "XRAY-CORE-NOTICE.md", "LICENSE")
          required = {
              "windows": {"sui.exe", "libcronet.dll", "s-ui-windows.xml", "install-windows.bat", "install-windows.ps1", "uninstall-windows.bat", "uninstall-windows.ps1", "s-ui-windows.bat", *docs},
              "linux": {"sui", "install.sh", "install-linux.sh", "uninstall-linux.sh", "s-ui.sh", *docs},
              "macos": {"sui", "install-macos.sh", "uninstall-macos.sh", "com.s-ui.plist", *docs},
          }
          cronet_sha256 = "3217c6260fbca5f16072e0b79735742f40109a63bb0ff88fd6b96dd6b54a2928"
          cronet_length = 9529344
          for archive in os.environ["ARCHIVES"].split():
              system = archive.split("-")[2]
              with zipfile.ZipFile(archive) as bundle:
                  names = [entry.filename for entry in bundle.infolist()]
                  if len(names) != len(set(names)):
                      raise SystemExit(f"duplicate ZIP entries: {archive}")
                  if set(names) - required[system]:
                      raise SystemExit(f"unexpected ZIP entries: {archive}")
                  if required[system] - set(names):
                      raise SystemExit(f"missing ZIP entries: {archive}")
                  for name in docs:
                      with bundle.open(name) as bundled, open(name, "rb") as source:
                          if hashlib.sha256(bundled.read()).digest() != hashlib.sha256(source.read()).digest():
                              raise SystemExit(f"embedded document differs from source: {archive}:{name}")
                  if system == "windows":
                      cronet = bundle.read("libcronet.dll")
                      if len(cronet) != cronet_length or hashlib.sha256(cronet).hexdigest() != cronet_sha256:
                          raise SystemExit(f"unexpected locked Cronet DLL: {archive}")
          print("archive structures and embedded documents verified")
          PY

      - name: Publish the verified tag and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          xray_module_version="$(go list -m -f '{{.Version}}' github.com/xtls/xray-core)"
          sing_box_module_version="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          version="${TAG#s-ui-go-v}"
          {
            printf -- '- 源代码提交：`%s`\n' "$RELEASE_SHA"
            printf -- '- Windows、Linux 和 macOS 的 `amd64` 安装包均由同一提交构建并完成验证。\n'
            printf -- '- sing-box 协议核心版本：`%s`。\n' "$sing_box_module_version"
            printf -- '- Xray-core 已由固定版本的 Go 模块编译并内嵌到 `sui`（`%s`）；未单独发布 `xray` 可执行文件。\n' "$xray_module_version"
            printf -- '- 安装前请使用每个 ZIP 对应的 `.sha256` 文件完成完整性校验。\n'
          } > "$notes_file"
          release_flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/s-ui-windows-amd64.zip \
            dist/s-ui-windows-amd64.zip.sha256 \
            dist/s-ui-linux-amd64.zip \
            dist/s-ui-linux-amd64.zip.sha256 \
            dist/s-ui-macos-amd64.zip \
            dist/s-ui-macos-amd64.zip.sha256 \
            --target "$RELEASE_SHA" \
            --title "s-ui-go ${version}" \
            "${release_flags[@]}" \
            --notes-file "$notes_file"
